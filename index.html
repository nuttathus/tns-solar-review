<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TNS Solar · ห้องรีวิวสื่อ</title>
<style>
@font-face{font-family:'Prompt';font-style:normal;font-weight:300;font-display:block;src:url('fonts/prompt-thai-300.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Prompt';font-style:normal;font-weight:300;font-display:block;src:url('fonts/prompt-latin-300.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+2080-2089,U+2190-21FF,U+2248,U+00D7,U+00F7,U+2264-2265}
@font-face{font-family:'Prompt';font-style:normal;font-weight:400;font-display:block;src:url('fonts/prompt-thai-400.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Prompt';font-style:normal;font-weight:400;font-display:block;src:url('fonts/prompt-latin-400.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+2080-2089,U+2190-21FF,U+2248,U+00D7,U+00F7,U+2264-2265}
@font-face{font-family:'Prompt';font-style:normal;font-weight:500;font-display:block;src:url('fonts/prompt-thai-500.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Prompt';font-style:normal;font-weight:500;font-display:block;src:url('fonts/prompt-latin-500.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+2080-2089,U+2190-21FF,U+2248,U+00D7,U+00F7,U+2264-2265}
@font-face{font-family:'Prompt';font-style:normal;font-weight:600;font-display:block;src:url('fonts/prompt-thai-600.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Prompt';font-style:normal;font-weight:600;font-display:block;src:url('fonts/prompt-latin-600.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+2080-2089,U+2190-21FF,U+2248,U+00D7,U+00F7,U+2264-2265}
@font-face{font-family:'Prompt';font-style:normal;font-weight:700;font-display:block;src:url('fonts/prompt-thai-700.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Prompt';font-style:normal;font-weight:700;font-display:block;src:url('fonts/prompt-latin-700.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+2080-2089,U+2190-21FF,U+2248,U+00D7,U+00F7,U+2264-2265}
:root{
  --navy:#0b2a55; --navy-2:#0e3a73; --blue:#1d6fd1; --sky:#38bdf8; --sun:#fcd34d;
  --bg:#f3f6fb; --card:#fff; --ink:#0f1f38; --muted:#5b6b84; --line:#dde5f0;
  --ok:#16a34a; --warn:#d97706; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
img,video{display:block;max-width:100%}

/* header */
.top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#12509a 100%);color:#fff;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(252,211,77,.35),rgba(252,211,77,0) 70%);pointer-events:none}
.top-in{max-width:1180px;margin:0 auto;padding:18px 16px 26px;position:relative;z-index:1}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:44px;width:auto}
.brand .tag{font-size:12px;font-weight:500;letter-spacing:.04em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;white-space:nowrap}
.top h1{font-size:clamp(22px,4.6vw,32px);font-weight:600;margin-top:18px;line-height:1.25}
.top p{color:rgba(255,255,255,.78);font-size:14px;margin-top:4px;font-weight:300}

/* collection switcher */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
.cols{display:flex;gap:10px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.colbtn{flex:0 0 auto;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:200px}
.colbtn b{display:block;font-weight:600;font-size:14px}
.colbtn span{font-size:12px;color:var(--muted)}
.colbtn[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,111,209,.14)}

/* collection head */
.chead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px;display:grid;gap:10px}
.chead h2{font-size:20px;font-weight:600;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.review{background:#fff4e0;color:var(--warn)}
.pill.approved{background:#e6f6ec;color:var(--ok)}
.pill.posted{background:#e8f0fb;color:var(--blue)}
.chead p{font-size:14px;color:var(--muted)}

/* view tabs */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:#e6ecf5;border-radius:12px;padding:4px}
.seg button{padding:7px 16px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,31,56,.12)}
.count{font-size:13px;color:var(--muted)}

/* grid */
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1100px){.grid.reels{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,31,56,.1)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.thumb{position:relative;background:#dfe7f2;aspect-ratio:9/16}
.grid.images .thumb{aspect-ratio:4/5}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ep{position:absolute;left:8px;top:8px;background:rgba(11,42,85,.88);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.thumb .play{position:absolute;inset:auto 8px 8px auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.thumb .play svg{width:14px;height:14px;margin-left:2px;fill:var(--navy)}
.card .t{padding:10px 12px 12px;font-size:13.5px;font-weight:500;line-height:1.35}

/* modal */
.modal{position:fixed;inset:0;background:rgba(6,18,38,.78);backdrop-filter:blur(4px);display:none;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.open{display:block}
.sheet{background:var(--bg);max-width:1100px;margin:0 auto;min-height:100%;position:relative}
@media(min-width:900px){.sheet{margin:28px auto;min-height:0;border-radius:20px;overflow:hidden}}
.mhead{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px}
.mhead .ttl{flex:1;min-width:0;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead .ttl small{opacity:.7;font-weight:400;margin-right:6px}
.ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:0 0 auto}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:disabled{opacity:.35;cursor:default}
.mbody{padding:16px;display:grid;gap:16px}
@media(min-width:900px){.mbody{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);padding:22px;gap:22px;align-items:start}}
.media{display:grid;gap:12px}
@media(min-width:560px) and (max-width:899px){.media{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel h3{font-size:13px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.vid{background:#000;aspect-ratio:9/16;max-height:78vh;margin:0 auto;width:100%}
.vid video{width:100%;height:100%;object-fit:contain;background:#000}
.panel .fname{font-size:11.5px;color:var(--muted);padding:8px 14px;word-break:break-all;border-top:1px solid var(--line)}
.caps{display:grid;gap:16px}
.cap pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.65;padding:14px;max-height:520px;overflow:auto}
.copy{font-size:12px;font-weight:500;color:var(--blue);background:#e8f0fb;padding:5px 12px;border-radius:8px}
.copy.done{color:var(--ok);background:#e6f6ec}
.chips{display:flex;gap:6px;align-items:center}
.chip{font-size:11px;font-weight:600;color:#fff;padding:2px 8px;border-radius:6px}
.chip.fb{background:#1877f2}.chip.tt{background:#111}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 20px}
@media(min-width:900px){.hint{grid-column:1/-1}}

footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="logo.png" alt="TNS Solar System">
      <span class="tag">สำหรับทีมภายใน</span>
    </div>
    <h1>ห้องรีวิวสื่อก่อนโพสต์</h1>
    <p>ดูภาพ คลิป และแคปชั่นที่เตรียมไว้ ก่อนลง Facebook / TikTok จริง</p>
  </div>
</header>

<main class="wrap">
  <nav class="cols" id="cols" aria-label="ชุดคอนเทนต์"></nav>
  <section class="chead" id="chead"></section>
  <div class="bar">
    <div class="seg" role="group" aria-label="มุมมอง">
      <button data-view="reels" aria-pressed="true">คลิป Reels</button>
      <button data-view="images" aria-pressed="false">ภาพโพสต์</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="grid reels" id="grid"></div>
</main>
<footer>คลิปบนเว็บเป็นไฟล์ย่อขนาด (720p) สำหรับดูตัวอย่าง · ไฟล์เต็มสำหรับโพสต์จริงอยู่ในโฟลเดอร์ TNS Solar บนเครื่อง Windows</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mttl">
  <div class="sheet">
    <div class="mhead">
      <button class="ibtn" id="mclose" aria-label="ปิด"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="ttl" id="mttl"></div>
      <button class="ibtn" id="mprev" aria-label="ตอนก่อนหน้า"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ibtn" id="mnext" aria-label="ตอนถัดไป"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var C = window.COLLECTIONS || [];
  var STATUS = {review:['review','รอรีวิว'], approved:['approved','อนุมัติแล้ว'], posted:['posted','โพสต์แล้ว']};
  var state = {col: null, view: 'reels', idx: -1};
  var $ = function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return (n<10?'0':'')+n}
  function st(s){var x=STATUS[s]||STATUS.review; return '<span class="pill '+x[0]+'">'+x[1]+'</span>'}

  function renderCols(){
    $('cols').style.display = C.length>1 ? '' : 'none';
    $('cols').innerHTML = C.map(function(c){
      return '<button class="colbtn" data-col="'+c.id+'" aria-pressed="'+(state.col===c?'true':'false')+'"><b>'+esc(c.title)+'</b><span>'+esc(c.date)+' · '+c.items.length+' ชิ้น</span></button>';
    }).join('');
  }
  function renderHead(){
    var c=state.col;
    $('chead').innerHTML = '<h2>'+esc(c.title)+'</h2><div class="meta">'+st(c.status)+'<span>ส่งรีวิว '+esc(c.date)+'</span><span>·</span><span>'+c.items.length+' ตอน (ภาพ + คลิป + แคปชั่น)</span></div><p>'+esc(c.desc)+'</p>';
  }
  function renderGrid(){
    var c=state.col, v=state.view, g=$('grid');
    g.className='grid '+v;
    document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed', b.dataset.view===v?'true':'false')});
    $('count').textContent = c.items.length+' '+(v==='reels'?'คลิป':'ภาพ');
    g.innerHTML = c.items.map(function(it,i){
      var src = c.base+(v==='reels'?it.poster:it.img);
      return '<button class="card" data-i="'+i+'"><div class="thumb"><img loading="lazy" src="'+src+'" alt=""><span class="ep">EP.'+pad(it.ep)+'</span>'+(v==='reels'?'<span class="play"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>':'')+'</div><div class="t">'+esc(it.title)+'</div></button>';
    }).join('') || '<div class="empty">ยังไม่มีรายการ</div>';
  }

  function capPanel(kind,label,text){
    return '<div class="panel cap"><h3><span class="chips"><span class="chip '+kind+'">'+label+'</span>แคปชั่น</span><button class="copy" data-copy="'+kind+'">คัดลอก</button></h3><pre id="cap-'+kind+'">'+esc(text)+'</pre></div>';
  }
  function openItem(i, push){
    var c=state.col, it=c.items[i]; if(!it) return;
    state.idx=i;
    $('mttl').innerHTML='<small>EP.'+pad(it.ep)+'</small>'+esc(it.title);
    $('mprev').disabled = i===0; $('mnext').disabled = i===c.items.length-1;
    $('mbody').innerHTML =
      '<div class="media">'+
        '<div class="panel"><h3>คลิป Reels 9:16</h3><div class="vid"><video controls playsinline preload="metadata" poster="'+c.base+it.poster+'" src="'+c.base+it.video+'"></video></div><div class="fname">'+esc(it.file_vid)+'</div></div>'+
        '<div class="panel"><h3>ภาพโพสต์ 4:5</h3><a href="'+c.base+it.img+'" target="_blank" rel="noopener"><img src="'+c.base+it.img+'" alt="ภาพโพสต์ EP.'+pad(it.ep)+'"></a><div class="fname">'+esc(it.file_img)+'</div></div>'+
      '</div>'+
      '<div class="caps">'+capPanel('fb','Facebook',it.fb)+capPanel('tt','TikTok',it.tt)+'</div>'+
      '<div class="hint">ใช้ปุ่ม ‹ › ด้านบน หรือปุ่มลูกศรบนคีย์บอร์ด เพื่อดูตอนถัดไป · คัดลอกลิงก์หน้านี้ส่งในกลุ่มได้</div>';
    var m=$('modal'); if(!m.classList.contains('open')){m.classList.add('open'); document.body.style.overflow='hidden';}
    m.scrollTop=0;
    var h='#'+c.id+'/ep'+pad(it.ep);
    if(location.hash!==h) history[push?'pushState':'replaceState'](null,'',h);
  }
  function closeModal(){
    var m=$('modal'); m.classList.remove('open'); document.body.style.overflow='';
    var v=m.querySelector('video'); if(v) v.pause();
    $('mbody').innerHTML=''; state.idx=-1;
    if(location.hash.indexOf('/ep')>-1) history.replaceState(null,'','#'+state.col.id);
  }
  function setCol(c){ state.col=c; renderCols(); renderHead(); renderGrid(); }

  function route(){
    var m=location.hash.match(/^#([\w-]+)(?:\/ep(\d+))?/);
    var c = (m && C.filter(function(x){return x.id===m[1]})[0]) || C[0];
    if(!c){ $('grid').innerHTML='<div class="empty">ยังไม่มีชุดคอนเทนต์</div>'; return; }
    if(state.col!==c) setCol(c);
    if(m && m[2]){
      var n=parseInt(m[2],10), i=c.items.findIndex(function(x){return x.ep===n});
      if(i>-1){ openItem(i,false); return; }
    }
    if($('modal').classList.contains('open')) closeModal();
  }

  document.addEventListener('click',function(e){
    var t;
    if((t=e.target.closest('.colbtn'))){ var c=C.filter(function(x){return x.id===t.dataset.col})[0]; history.pushState(null,'','#'+c.id); setCol(c); return; }
    if((t=e.target.closest('.seg button'))){ state.view=t.dataset.view; renderGrid(); return; }
    if((t=e.target.closest('.card'))){ openItem(+t.dataset.i,true); return; }
    if((t=e.target.closest('.copy'))){
      var txt=$('cap-'+t.dataset.copy).textContent;
      var done=function(){t.textContent='คัดลอกแล้ว ✓'; t.classList.add('done'); setTimeout(function(){t.textContent='คัดลอก'; t.classList.remove('done')},1800)};
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done()}); } else { fallback(txt); done(); }
      return;
    }
    if(e.target.id==='modal') closeModal();
  });
  function fallback(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}document.body.removeChild(ta)}
  $('mclose').onclick=closeModal;
  $('mprev').onclick=function(){openItem(state.idx-1,false)};
  $('mnext').onclick=function(){openItem(state.idx+1,false)};
  document.addEventListener('keydown',function(e){
    if(!$('modal').classList.contains('open')) return;
    if(e.key==='Escape') closeModal();
    else if(e.key==='ArrowLeft' && state.idx>0) openItem(state.idx-1,false);
    else if(e.key==='ArrowRight' && state.idx<state.col.items.length-1) openItem(state.idx+1,false);
  });
  window.addEventListener('popstate',route);
  route();
})();
</script>
</body>
</html>
